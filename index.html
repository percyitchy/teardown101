<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teardown 101</title>
<meta name="description" content="Learn to reverse engineer any app in 12 interactive lessons: map screens, inspect elements, read the network, decode files, then rebuild it clean-room.">
<meta property="og:title" content="Teardown 101">
<meta property="og:description" content="12 interactive lessons on reverse engineering any app, with a fake app to take apart.">
<link rel="stylesheet" href="./src/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231E2A44'/><circle cx='14' cy='14' r='6.5' stroke='%23F3EAD8' stroke-width='2.6' fill='none'/><path d='M19 19l6 6' stroke='%23E0773F' stroke-width='3' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="app">
	<header class="top">
		<div class="logo-wrap">
			<svg class="logo" viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="12"/><circle cx="21" cy="21" r="9"/><path d="M28 28l9 9"/><path d="M17 21h8M21 17v8" class="lt"/></svg>
		</div>
		<div class="title">
			<h1>TEARDOWN 101</h1>
			<span>OBSERVE · INTERCEPT · DECODE · REBUILD</span>
		</div>
		<div class="top-right">
			<div class="chip-prog">
				<svg viewBox="0 0 24 24"><path d="M4 5h11l5 5v9H4z"/><path d="M15 5v5h5M8 13h8M8 16h5"/></svg>
				<div><b id="prog-grp">OBSERVE</b><div class="bar"><i id="prog-bar"></i></div></div>
				<span id="prog-txt">0/26</span>
			</div>
			<div class="clock"><span>SESSION</span><b id="clock">00:00:00</b></div>
			<button id="sound" class="sound" aria-label="Sound on/off" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M19 7a7 7 0 0 1 0 10"/><path class="x" d="M17 9.5l5 5M22 9.5l-5 5"/></svg></button>
		</div>
	</header>

	<aside class="rail">
		<button id="rail-home" title="First lesson"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
		<button id="rail-panel" title="Hide panel"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14 4.5v15"/></svg></button>
		<button id="reset" title="Reset progress"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg></button>
		<a class="rail-x" href="https://x.com/zodchiii" target="_blank" rel="noopener" title="@zodchiii"><span>BY @ZODCHIII</span><svg viewBox="0 0 24 24"><path d="M5 4l14 16M19 4L5 20"/></svg></a>
	</aside>

	<main id="stage" class="stage">
		<svg class="traces" aria-hidden="true" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
			<path d="M0 90h140l40 40h220M1000 140H840l-30 30H640M0 560h90l50-50h160M1000 600H880l-40-40H700M60 0v60l30 30M940 700v-70l-30-30"/>
			<circle cx="400" cy="130" r="5"/><circle cx="640" cy="170" r="5"/><circle cx="300" cy="510" r="5"/><circle cx="700" cy="560" r="5"/>
		</svg>
		<div class="mat" aria-hidden="true"></div>
		<svg class="tool tl-driver" viewBox="0 0 240 60" aria-hidden="true"><rect x="8" y="14" width="96" height="32" rx="14" fill="#5FA8A2"/><path d="M28 14v32M44 14v32M60 14v32M76 14v32" stroke="#3F8580" stroke-width="3"/><rect x="104" y="24" width="104" height="12" rx="3" fill="#C9CED6"/><path d="M208 24l22 6-22 6z" fill="#9AA1AC"/></svg>
		<svg class="tool tl-loupe" viewBox="0 0 160 160" aria-hidden="true"><circle cx="62" cy="62" r="44" fill="#DCEFF0" fill-opacity=".7" stroke="#1E2A44" stroke-width="10"/><path d="M40 46a28 28 0 0 1 22-14" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/><rect x="96" y="92" width="24" height="60" rx="10" transform="rotate(-45 108 122)" fill="#E0773F" stroke="#1E2A44" stroke-width="6"/></svg>
		<svg class="tool tl-tweezers" viewBox="0 0 200 50" aria-hidden="true"><path d="M6 25L188 12l4 5L20 27zM6 25l182 13 4-5L20 23z" fill="#B9C0CA" stroke="#1E2A44" stroke-width="4" stroke-linejoin="round"/></svg>
		<div class="tool tl-note" aria-hidden="true"><b>pulse.app</b><span>teardown notes<br>v3.18.2</span></div>
		<svg class="tool tl-screws" viewBox="0 0 120 50" aria-hidden="true"><g fill="#C9CED6" stroke="#1E2A44" stroke-width="4"><circle cx="20" cy="25" r="11"/><circle cx="58" cy="18" r="9"/><circle cx="96" cy="30" r="10"/></g><path d="M14 25h12M54 15l8 6M90 30h12M96 24v12" stroke="#1E2A44" stroke-width="3"/></svg>

		<div class="specimen">
			<div class="spec-tag"><i></i>TARGET · PULSE.APP <em>FICTIONAL</em></div>
			<div class="device-box">
				<div id="device" class="device">
					<div id="device-screen" class="device-screen">
						<div id="pulse" class="pulse"></div>
						<div id="inspect-box" class="inspect-box" hidden><span id="inspect-tag"></span></div>
					</div>
				</div>
			</div>
		</div>
		<div id="callouts" class="callouts"></div>
		<div class="stage-hint">Use Pulse like a normal app · every tap is logged in the lab</div>
	</main>

	<section class="panel">
		<nav class="ptabs">
			<button class="ptab on" data-tab="overview">OVERVIEW</button>
			<button class="ptab" data-tab="lab">LAB <span id="tab-lab-n">0/0</span></button>
			<div class="pager"><button id="pager-prev" aria-label="Previous lesson">‹</button><button id="pager-next" aria-label="Next lesson">›</button></div>
		</nav>
		<div id="panel-body" class="panel-body">
			<article id="ov" class="ov"></article>
			<div id="lab" class="lab" hidden></div>
		</div>
	</section>

	<footer class="foot">
		<div class="strip-head"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><b id="strip-label">LESSON: OBSERVE</b></div>
		<div class="strip-wrap">
			<button id="strip-left" class="strip-arrow" aria-label="Scroll lessons left">‹</button>
			<div id="strip" class="strip"></div>
			<button id="strip-right" class="strip-arrow dark" aria-label="Scroll lessons right">›</button>
		</div>
	</footer>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
